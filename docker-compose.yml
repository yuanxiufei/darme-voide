# Drama Studio —— 生产编排（**Python 后端版**，2026-09-15 随 Dockerfile 一起重写）
# 旧版是 Node 时代产物（5789 / NODE_ENV=production），随 `backend/` 一起退役。
services:
  drama-studio:
    build: .
    ports:
      - "5790:5790"
    volumes:
      # 数据根目录（容器内默认 /app/data）。若通过 DATA_ROOT 或设置页切换了数据目录，
      # 需同步挂载新目录到容器，否则容器重建后数据会丢失。
      - ./data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml
    environment:
      - PORT=5790
      - PYTHONUNBUFFERED=1
      # 如需指定数据根目录，取消注释并同步调整上方 volume 挂载（推荐用 env + 卷固定数据位置）：
      # - DATA_ROOT=/app/data
    restart: unless-stopped

# 外部技能库声明文件
#
# 含本文件的顶层目录 = 一个「技能库（vendor）」：
#   - 后端起 /skills 与 /skills/meta 时按此识别，前端侧栏自动成组 —— 换库 / 加库 / 改显示名零代码
#   - 库内所有 skill 一律不默认注入，需在「Agent 配置 → 绑定 Skills」按需手动启用
#
# name  库标识，作为 API 与前端分组的稳定 key（缺省 = 目录名）；改它 = 改引用，慎改
# label 展示名，可随时改，不影响任何引用
name: production-tools
label: 制作工序库
description: 制作链路上的单点能力与工序工具 —— 编剧、分镜、镜头调度、画面资产、配音、剪辑、字幕，以及 Skill 自身的元工具。
